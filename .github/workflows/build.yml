name: Build Opera Proxy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_build:
        description: 'Тестовая сборка (без публикации релиза)'
        type: boolean
        default: false
  schedule:
    - cron: '14 1 * * 5'

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      # opera-proxy: версия из upstream (Alexey71/opera-proxy), тег v<ver>
      ver: ${{ steps.get_ver.outputs.ver }}
      exists: ${{ steps.check.outputs.exists }}
      # luci-app-opera-proxy: версия из нашего Makefile, тег luci-v<ver>-r<rel>
      luci_ver: ${{ steps.luci_ver.outputs.luci_ver }}
      luci_exists: ${{ steps.check_luci.outputs.exists }}
    steps:
      # Нужен, чтобы прочитать luci-app-opera-proxy/Makefile
      - uses: actions/checkout@v6

      - name: Get Latest Version (opera-proxy)
        id: get_ver
        run: |
          # Корректно получаем последнюю версию из релизов Alexey71/opera-proxy
          VER=$(curl -fs -o /dev/null -w %{redirect_url} https://github.com/Alexey71/opera-proxy/releases/latest | cut -d '/' -f8 | sed 's/^v//')
          [ -z "$VER" ] && VER="1.0.0"
          echo "ver=$VER" >> $GITHUB_OUTPUT
          echo "VER=$VER" >> $GITHUB_ENV

      - name: Check Release (opera-proxy)
        id: check
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository }}/releases/tags/v${{ env.VER }})
          echo "exists=$([ "$HTTP_STATUS" -eq 200 ] && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT

      - name: Get LuCI version from Makefile
        id: luci_ver
        run: |
          MK=luci-app-opera-proxy/Makefile
          V=$(sed -n 's/^PKG_VERSION[[:space:]]*:=[[:space:]]*//p' "$MK" | head -n1 | tr -d '[:space:]\r')
          R=$(sed -n 's/^PKG_RELEASE[[:space:]]*:=[[:space:]]*//p' "$MK" | head -n1 | tr -d '[:space:]\r')
          if [ -z "$V" ]; then
            echo "Не удалось прочитать PKG_VERSION из $MK"
            exit 1
          fi
          [ -z "$R" ] && R=1
          echo "Версия luci-app-opera-proxy: ${V}-r${R}"
          echo "luci_ver=${V}-r${R}" >> $GITHUB_OUTPUT
          echo "LUCI_VER=${V}-r${R}" >> $GITHUB_ENV

      - name: Check Release (luci-app-opera-proxy)
        id: check_luci
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository }}/releases/tags/luci-v${{ env.LUCI_VER }})
          echo "exists=$([ "$HTTP_STATUS" -eq 200 ] && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT

  # ---------------------------------------------------------------------------
  # opera-proxy (бинарник): собирается, только если нет релиза этой версии
  # ---------------------------------------------------------------------------
  build-proxy:
    name: build-proxy (${{ matrix.openwrt_ver }}, ${{ matrix.pkg_arch }})
    needs: check-version
    # В тестовом режиме собираем, даже если релиз этой версии уже существует
    if: needs.check-version.outputs.exists == 'false' || inputs.test_build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- OPENWRT 24.10 (Формат пакетов: .ipk) ---
          - openwrt_ver: "24.10"
            pkg_ext: "ipk"
            pkg_arch: "mipsel_24kc"
            target_name: "ramips/mt7621"
            goarch: "mipsle"
            gomips: "softfloat"
          - openwrt_ver: "24.10"
            pkg_ext: "ipk"
            pkg_arch: "aarch64_cortex-a53"
            target_name: "mediatek/filogic"
            goarch: "arm64"
            gomips: ""
          - openwrt_ver: "24.10"
            pkg_ext: "ipk"
            pkg_arch: "x86_64"
            target_name: "x86/64"
            goarch: "amd64"
            gomips: ""

          # --- OPENWRT 25.12 (Формат пакетов: .apk) ---
          - openwrt_ver: "25.12"
            pkg_ext: "apk"
            pkg_arch: "mipsel_24kc"
            target_name: "ramips/mt7621"
            goarch: "mipsle"
            gomips: "softfloat"
          - openwrt_ver: "25.12"
            pkg_ext: "apk"
            pkg_arch: "aarch64_cortex-a53"
            target_name: "mediatek/filogic"
            goarch: "arm64"
            gomips: ""
          - openwrt_ver: "25.12"
            pkg_ext: "apk"
            pkg_arch: "x86_64"
            target_name: "x86/64"
            goarch: "amd64"
            gomips: ""

    steps:
      # Клонируем НАШ собственный репозиторий, где лежат папка opera-proxy и Makefile
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Compile Opera Proxy Binary
        run: |
          # Клонируем ПРАВИЛЬНЫЙ репозиторий с исходным кодом прокси
          git clone https://github.com/Alexey71/opera-proxy.git source
          cd source
          # CGO_ENABLED=0 обязателен: без него для x86_64 (хост раннера тоже linux/amd64,
          # то есть это НЕ кросс-компиляция) Go по умолчанию включает cgo и линкует
          # бинарник динамически с glibc раннера — то есть libc.so.6, которого попросту
          # нет в musl-окружении OpenWrt. mipsel/aarch64 собираются статически "бесплатно",
          # потому что для них это настоящая кросс-компиляция и cgo сам по себе выключен.
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.goarch }} GOMIPS=${{ matrix.gomips }} go build -ldflags="-s -w" -trimpath -o ../opera-proxy-bin
          cd ..

      - name: Install dependencies
        run: sudo apt update && sudo apt install -y libncurses5-dev zstd xz-utils upx-ucl

      - name: Resolve OpenWrt version & SDK URL
        id: sdk
        run: |
          BRANCH="${{ matrix.openwrt_ver }}"

          # Ищем последнюю патч-версию нужной ветки (например 24.10 -> 24.10.2)
          FULL_VER=$(curl -s "https://downloads.openwrt.org/releases/" \
            | grep -oE "${BRANCH//./\\.}\.[0-9]+" \
            | sort -V | uniq | tail -1)

          if [ -z "$FULL_VER" ]; then
            echo "Не удалось определить актуальную версию OpenWrt для ветки $BRANCH"
            exit 1
          fi
          echo "Актуальная версия OpenWrt для ветки $BRANCH: $FULL_VER"

          # Ищем файл SDK в папке target'а, как в примере
          TARGET_DIR="${{ matrix.target_name }}"
          BASE_URL="https://downloads.openwrt.org/releases/$FULL_VER/targets/$TARGET_DIR"
          SDK_FILENAME=$(curl -s "$BASE_URL/" \
            | grep -o 'href="[^"]*openwrt-sdk-[^"]*\.tar\.\(zst\|xz\)"' \
            | sed 's/href="//;s/"$//' | head -1)

          if [ -z "$SDK_FILENAME" ]; then
            echo "Не удалось найти SDK для $TARGET_DIR (OpenWrt $FULL_VER)"
            exit 1
          fi

          echo "Найден SDK: $SDK_FILENAME"
          echo "sdk_url=$BASE_URL/$SDK_FILENAME" >> $GITHUB_OUTPUT
          echo "sdk_filename=$SDK_FILENAME" >> $GITHUB_OUTPUT

      - name: Setup SDK
        run: |
          wget -O sdk.archive "${{ steps.sdk.outputs.sdk_url }}"
          mkdir sdk
          FILENAME="${{ steps.sdk.outputs.sdk_filename }}"
          if [[ "$FILENAME" == *.tar.zst ]]; then
            tar --use-compress-program=unzstd -xf sdk.archive -C sdk --strip-components=1
          else
            tar -xJf sdk.archive -C sdk --strip-components=1
          fi

      - name: Compress binary with UPX
        run: |
          echo "Размер до сжатия:"
          ls -l opera-proxy-bin
          upx --best --lzma opera-proxy-bin
          # Проверяем целостность упакованного файла
          upx -t opera-proxy-bin
          echo "Размер после сжатия:"
          ls -l opera-proxy-bin

      - name: Prepare Package
        run: |
          # Копируем скомпилированный нами Go-бинарник в структуру пакета
          mkdir -p opera-proxy/files/usr/bin
          cp opera-proxy-bin opera-proxy/files/usr/bin/opera-proxy
          chmod +x opera-proxy/files/usr/bin/opera-proxy

          # Прописываем актуальную версию в Makefile пакета
          VER="${{ needs.check-version.outputs.ver }}"
          [ -z "$VER" ] || [ "$VER" = "null" ] && VER="1.0.0"
          sed -i "s/^PKG_VERSION:=.*$/PKG_VERSION:=$VER/" opera-proxy/Makefile

          # luci-app нужен SDK только ради зависимости +opera-proxy при defconfig;
          # сам он собирается отдельным job'ом (build-luci)
          cp -r opera-proxy sdk/package/
          cp -r luci-app-opera-proxy sdk/package/

      - name: Compile Package
        run: |
          cd sdk
          make oldconfig || make defconfig
          ./scripts/feeds update base luci
          ./scripts/feeds install -a
          echo "CONFIG_PACKAGE_opera-proxy=y" >> .config
          make defconfig
          make package/opera-proxy/compile V=s -j$(nproc)

          echo "=== Поиск и копирование готовых пакетов ==="
          mkdir -p ../output-artifacts

          VER="${{ needs.check-version.outputs.ver }}"
          [ -z "$VER" ] || [ "$VER" = "null" ] && VER="1.0.0"

          # ipk называет файлы через подчёркивание (opera-proxy_1.14.0-1_mipsel_24kc.ipk),
          # apk — через дефис и без подчёркиваний (opera-proxy-1.14.0-r1.apk),
          # поэтому [_-] покрывает оба варианта одним шаблоном.
          find bin/ -name "opera-proxy[_-]*.${{ matrix.pkg_ext }}" -exec cp {} ../output-artifacts/opera-proxy-${VER}-${{ matrix.pkg_arch }}-v${{ matrix.openwrt_ver }}.${{ matrix.pkg_ext }} \;

          if ! ls ../output-artifacts/opera-proxy-*.${{ matrix.pkg_ext }} >/dev/null 2>&1; then
            echo "Пакет opera-proxy не найден после компиляции!"
            exit 1
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: opera-proxy-${{ matrix.pkg_arch }}-v${{ matrix.openwrt_ver }}
          path: output-artifacts/
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # luci-app-opera-proxy: собирается, только если нет релиза версии из Makefile
  # (PKGARCH:=all, поэтому достаточно одного target'а на ветку OpenWrt)
  # ---------------------------------------------------------------------------
  build-luci:
    name: build-luci (${{ matrix.openwrt_ver }}, ${{ matrix.pkg_ext }})
    needs: check-version
    if: needs.check-version.outputs.luci_exists == 'false' || inputs.test_build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - openwrt_ver: "24.10"
            pkg_ext: "ipk"
            target_name: "ramips/mt7621"
          - openwrt_ver: "25.12"
            pkg_ext: "apk"
            target_name: "ramips/mt7621"

    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: sudo apt update && sudo apt install -y libncurses5-dev zstd xz-utils

      - name: Resolve OpenWrt version & SDK URL
        id: sdk
        run: |
          BRANCH="${{ matrix.openwrt_ver }}"

          FULL_VER=$(curl -s "https://downloads.openwrt.org/releases/" \
            | grep -oE "${BRANCH//./\\.}\.[0-9]+" \
            | sort -V | uniq | tail -1)

          if [ -z "$FULL_VER" ]; then
            echo "Не удалось определить актуальную версию OpenWrt для ветки $BRANCH"
            exit 1
          fi
          echo "Актуальная версия OpenWrt для ветки $BRANCH: $FULL_VER"

          TARGET_DIR="${{ matrix.target_name }}"
          BASE_URL="https://downloads.openwrt.org/releases/$FULL_VER/targets/$TARGET_DIR"
          SDK_FILENAME=$(curl -s "$BASE_URL/" \
            | grep -o 'href="[^"]*openwrt-sdk-[^"]*\.tar\.\(zst\|xz\)"' \
            | sed 's/href="//;s/"$//' | head -1)

          if [ -z "$SDK_FILENAME" ]; then
            echo "Не удалось найти SDK для $TARGET_DIR (OpenWrt $FULL_VER)"
            exit 1
          fi

          echo "Найден SDK: $SDK_FILENAME"
          echo "sdk_url=$BASE_URL/$SDK_FILENAME" >> $GITHUB_OUTPUT
          echo "sdk_filename=$SDK_FILENAME" >> $GITHUB_OUTPUT

      - name: Setup SDK
        run: |
          wget -O sdk.archive "${{ steps.sdk.outputs.sdk_url }}"
          mkdir sdk
          FILENAME="${{ steps.sdk.outputs.sdk_filename }}"
          if [[ "$FILENAME" == *.tar.zst ]]; then
            tar --use-compress-program=unzstd -xf sdk.archive -C sdk --strip-components=1
          else
            tar -xJf sdk.archive -C sdk --strip-components=1
          fi

      - name: Prepare Packages
        run: |
          # luci-app зависит от +opera-proxy, поэтому пакет opera-proxy должен
          # присутствовать в SDK, иначе defconfig отключит luci-app. Настоящий
          # бинарник здесь не нужен: кладём пустую заглушку, этот пакет никуда
          # не публикуется.
          mkdir -p opera-proxy/files/usr/bin
          : > opera-proxy/files/usr/bin/opera-proxy
          chmod +x opera-proxy/files/usr/bin/opera-proxy

          cp -r opera-proxy sdk/package/
          cp -r luci-app-opera-proxy sdk/package/

      - name: Compile Package
        run: |
          cd sdk
          make oldconfig || make defconfig
          ./scripts/feeds update base luci
          ./scripts/feeds install -a
          echo "CONFIG_PACKAGE_opera-proxy=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-opera-proxy=y" >> .config
          make defconfig
          make package/opera-proxy/compile V=s -j$(nproc)
          make package/luci-app-opera-proxy/compile V=s -j$(nproc)

          mkdir -p ../luci-artifacts

          # Версия — из Makefile luci-app (формат <PKG_VERSION>-r<PKG_RELEASE>)
          LVER="${{ needs.check-version.outputs.luci_ver }}"

          find bin/ -name "luci-app-opera-proxy[_-]*.${{ matrix.pkg_ext }}" -exec cp {} ../luci-artifacts/luci-app-opera-proxy-${LVER}-v${{ matrix.openwrt_ver }}.${{ matrix.pkg_ext }} \;

          if ! ls ../luci-artifacts/luci-app-opera-proxy-*.${{ matrix.pkg_ext }} >/dev/null 2>&1; then
            echo "Пакет luci-app-opera-proxy не найден после компиляции!"
            exit 1
          fi

      - name: Upload LuCI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-opera-proxy-v${{ matrix.openwrt_ver }}
          path: luci-artifacts/
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Публикация: два независимых релиза (v<ver> и luci-v<ver>-r<rel>)
  # ---------------------------------------------------------------------------
  publish:
    needs: [check-version, build-proxy, build-luci]
    # В тестовом режиме релиз не публикуем. always-подобное условие нужно, потому что
    # один из build-job'ов может быть пропущен (skipped) — тогда обычный needs
    # заблокировал бы и publish.
    if: >-
      ${{ !inputs.test_build && !cancelled() && !contains(needs.*.result, 'failure')
      && (needs.build-proxy.result == 'success' || needs.build-luci.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Publish Release (opera-proxy)
        if: needs.build-proxy.result == 'success'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.check-version.outputs.ver }}
          name: "v${{ needs.check-version.outputs.ver }}"
          files: |
            artifacts/opera-proxy-*/*.ipk
            artifacts/opera-proxy-*/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Release (luci-app-opera-proxy)
        if: needs.build-luci.result == 'success'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: luci-v${{ needs.check-version.outputs.luci_ver }}
          name: "luci-app-opera-proxy v${{ needs.check-version.outputs.luci_ver }}"
          # LuCI-релиз не должен становиться "Latest", иначе /releases/latest
          # будет указывать на него вместо релиза opera-proxy
          make_latest: false
          files: |
            artifacts/luci-app-opera-proxy-*/*.ipk
            artifacts/luci-app-opera-proxy-*/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
